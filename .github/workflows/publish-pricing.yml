name: Publish pricing

on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pricing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

      - name: Download accepted catalog printing crosswalk
        run: >-
          npm run pricing:fetch:catalog --
          --game pokemon
          --output pricing-work/printings.json
          --metadata pricing-work/catalog.json

      - name: Fetch daily TCGCSV prices
        env:
          TCGCSV_USER_AGENT: CadenceCatalog/0.1.0 (+https://cadencetcg.dev)
        run: npm run pricing:fetch:tcgcsv -- --category-id 3 --output snapshots/pricing/tcgcsv

      - name: Normalize and package pricing
        run: |
          feed=$(node -p "require('./snapshots/pricing/tcgcsv/latest.json').feed")
          catalog_build=$(node -p "require('./pricing-work/catalog.json').buildId")
          npm run pricing:ingest -- --input "snapshots/pricing/tcgcsv/$feed" --printings pricing-work/printings.json --catalog-build-id "$catalog_build" --output pricing-work/batch.json
          npm run pricing:package -- --input pricing-work/batch.json --output pricing-dist

      - name: Publish pricing to Cloudflare R2
        if: vars.R2_CATALOG_BUCKET != '' && vars.R2_PUBLIC_BASE_URL != ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_CATALOG_BUCKET: ${{ vars.R2_CATALOG_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: npm run pricing:publish-r2 -- --root pricing-dist

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pricing-publication-${{ github.run_id }}
          path: |
            pricing-work/catalog.json
            pricing-dist/manifest.json
            pricing-dist/rejected.json
          if-no-files-found: warn
          retention-days: 14
